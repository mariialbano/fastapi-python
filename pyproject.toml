[project]
name = "techlog-solutions"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "black>=26.3.1",
    "fastapi>=0.135.2",
    "flake8>=7.3.0",
    "git-filter-repo>=2.47.0",
    "isort>=8.0.1",
    "jinja2>=3.1.6",
    "pylint>=4.0.5",
    "python-multipart>=0.0.26",
    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
pythonpath = ["."]
[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.flake8]
max-line-length = 88

[tool.pylint]
max-line-length = 88
disable = ["C0114", "C0115", "C0116", "W0621"]
init-hook = 'import sys; sys.path.append(".")'
