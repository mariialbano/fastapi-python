[project]
name = "techlog-solutions"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "black>=26.3.1",
    "fastapi>=0.135.2",
    "flake8>=7.3.0",
    "isort>=8.0.1",
    "jinja2>=3.1.6",
    "pylint>=4.0.5",
    "python-multipart>=0.0.26",
    "uvicorn>=0.42.0",
]
[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.flake8]
max-line-length = 88

[tool.pylint]
max-line-length = 88
disable = ["C0114", "C0115", "C0116"]
